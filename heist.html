<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blades in the Dark - Golpe</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./clocks/clocks.css">
    <link rel="manifest" href="./manifest.json">

    <script type="module" src="./js/script.js" defer></script>

</head>
<body>
    <nav id="site-nav" class="floating-nav"></nav>

    <main id="main" class="heist-page">
        <article id="heist-article">
            <section class="heist-information-section">
                <div class="input-field">
                    <label for="heist-name">Nome do golpe</label>
                    <input type="text" id="heist-name" name="heist-name" data-heist-field>
                </div>
                <div class="input-field">
                    <label for="heist-type">Tipo de golpe</label>
                    <select id="heist-type" name="heist-type" data-heist-field>
                        <option value="">Selecione o tipo</option>
                    </select>
                    <small id="heist-type-description" class="heist-type-description"></small>
                </div>
                <div class="input-field">
                    <label for="heist-target">Alvo</label>
                    <input type="text" id="heist-target" name="heist-target" data-heist-field>
                </div>
                <div class="input-field">
                    <label for="heist-detail">Detalhe</label>
                    <input type="text" id="heist-detail" name="heist-detail" data-heist-field>
                </div>
                <div class="input-field">
                    <label for="heist-situation">Situação</label>
                    <input type="text" id="heist-situation" name="heist-situation" data-heist-field>
                </div>
            </section>

            <section id="heist-factions-section" class="heist-section">
                <div class="heist-section-heading">
                    <h2>Interação com facções</h2>
                    <button id="heist-add-faction" type="button">Adicionar facção</button>
                </div>
                <datalist id="heist-faction-options"></datalist>
                <div id="heist-faction-interaction" aria-live="polite"></div>
            </section>

            <section id="heist-rewards-section" class="heist-section">
                <h2>Recompensas e consequências</h2>
                <div class="heist-rewards-grid">
                    <div class="input-field">
                        <label for="heist-moedas">Moedas</label>
                        <input type="number" id="heist-moedas" name="heist-moedas" min="0" step="1" data-heist-field>
                    </div>
                    <div class="input-field">
                        <label for="heist-moral">Moral</label>
                        <input type="number" id="heist-moral" name="heist-moral" min="0" step="1" data-heist-field>
                    </div>
                    <div class="input-field">
                        <label for="heist-atencao">Atenção</label>
                        <input type="number" id="heist-atencao" name="heist-atencao" min="0" step="1" data-heist-field>
                    </div>
                </div>
            </section>

            <section id="heist-notes-section" class="heist-section">
                <h2>Notas do golpe</h2>
                <div class="input-field heist-notes-field">
                    <label for="heist-notes">Planejamento, descobertas e consequências</label>
                    <textarea id="heist-notes" name="heist-notes" rows="5" data-heist-field></textarea>
                </div>
            </section>
        </article>

        <article id="heist-clocks-article">
            <section class="heist-section">
                <h2>Relógios do golpe</h2>
                <div id="heist-clocks-container"></div>
            </section>
        </article>
    </main>

    <div id="modalsContainer"></div>
    <footer id="site-footer"></footer>
</body>
</html>
